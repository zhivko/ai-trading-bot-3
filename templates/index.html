<!doctype html>
<html>
<head>
    <title>AI Bot Backtest</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-3.3.0.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; }
        .stats { display: flex; gap: 20px; background: #222; padding: 15px; border-bottom: 1px solid #333; justify-content: center; flex-shrink: 0; }
        .stat-box { text-align: center; }
        .val { font-size: 1.5em; font-weight: bold; }
        .pos { color: #4caf50; }
        .neg { color: #f44336; }
        .controls { text-align: center; padding: 10px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; }
        .chart-container { flex: 1; padding: 20px; overflow: auto; }
        @media (max-width: 768px) {
            .stats { flex-direction: column; gap: 10px; align-items: center; }
            .controls { display: flex; flex-direction: column; align-items: center; }
            .controls button { width: 100%; max-width: 200px; margin: 5px 0; }
        }
    </style>
</head>
<body>
    <div class="stats">
        <div class="stat-box">
            <div>Initial</div>
            <div class="val">{{ "%.2f"|format(initial) }}</div>
        </div>
        <div class="stat-box">
            <div>Final</div>
            <div class="val">{{ "%.2f"|format(final) }}</div>
        </div>
        <div class="stat-box">
            <div>ROI</div>
            <div class="val {{ 'pos' if roi > 0 else 'neg' }}">{{ "%.2f"|format(roi) }}%</div>
        </div>
    </div>
    <div class="controls">
        <button id="pan_left" style="margin: 0 10px; padding: 10px 20px; background: #444; color: #eee; border: none; cursor: pointer;">← Pan Left (1 Month)</button>
        <button id="pan_right" style="margin: 0 10px; padding: 10px 20px; background: #444; color: #eee; border: none; cursor: pointer;">Pan Right (1 Month) →</button>
    </div>
    <div class="chart-container">
        {{ chart|safe }}
    </div>
    <script src="{{ url_for('static', filename='js/backtest.js') }}"></script>
</body>
</html>
